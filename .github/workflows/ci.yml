name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4
  # Plain Postgres service — no PgBouncer, so no pgbouncer flag.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/studioflow"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/studioflow"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studioflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @studioflow/db exec prisma generate

      - name: Run migrations
        run: pnpm --filter @studioflow/db exec prisma migrate deploy

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Test (incl. real-DB integration against the Postgres service)
        run: pnpm test
        env:
          INTEGRATION_DB: '1'

      - run: pnpm build
